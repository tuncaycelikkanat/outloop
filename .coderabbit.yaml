# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "tr-TR"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "develop"

  # No More Reels - Projeye Özel Mimari ve Tasarım Kuralları
  path_instructions:
    - path: "app/src/main/AndroidManifest.xml"
      instructions: |
        KRİTİK GÜVENLİK KURALI: Bu proje %100 Çevrimdışıdır (Zero-Internet Policy).
        AndroidManifest.xml dosyasında kesinlikle 'android.permission.INTERNET' izni OLMAMALIDIR.
        Eğer internet izni eklenmişse derhal PR'ı engelleyen bir uyarı yaz.

    - path: "app/src/main/java/com/nomorereels/app/ui/**"
      instructions: |
        TASARIM SİSTEMİ KURALLARI (NoMoreReelsTheme):
        1. Sıfır Gölge (Flat): 'shadowElevation' ve 'tonalElevation' kesinlikle 0.dp olmalıdır. Gradyan, bulanıklık veya parlama efektleri yasaktır.
        2. Kart Kuralı: 16.dp kartlar yalnızca en üstteki 'NmrHeroCard' ve o an seçili liste satırında ('NmrSelectableRow') kullanılır. Kart içinde kart (nested card) kesinlikle yasaktır.
        3. Sayılar ve Sayaçlar: Tüm sayısal göstergelerde 'fontFeatureSettings = "tnum"' kullanılmalıdır.
        4. Recomposition: Döngülerde veya listelerde 'key' parametrelerinin doğru tanımlandığından ve gereksiz recomposition oluşturulmadığından emin ol.

    - path: "app/src/main/java/com/nomorereels/app/service/**"
      instructions: |
        ERİŞİLEBİLİRLİK VE PERFORMANS KURALLARI:
        1. 'onAccessibilityEvent' içinde ağır işlemler (I/O, veritabanı yazma) ana thread'i bloke etmemelidir.
        2. Düğüm ağacı (AccessibilityNodeInfo) taramalarında bellek sızıntısını önlemek için 'recycle()' veya güvenli null kontrolleri yapılmalıdır.
        3. Olay gürültüsünü (event flooding) engellemek için debouncing/cooldown kontrolleri korunmalıdır.

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
